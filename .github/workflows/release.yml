name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, create GitHub releases
      pull-requests: write # open/update the release PR
      id-token: write # mint the OIDC token for npm trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No `version:` — action-setup reads the root packageManager pin, so a
      # bump there moves local and CI together.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm 11.5.1+; the runner's Node 22 ships
      # npm 10. Mirrors charivo, whose packages have carried SLSA provenance on
      # every version published since it added this step.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # With changesets pending, this opens/updates a release PR that applies
      # them (versions + CHANGELOGs). Merging that PR lands a main push with no
      # changesets left, and this same step then runs `pnpm release` to publish.
      #
      # `version:` is spelled out because `pnpm version` would hit pnpm's
      # built-in version command instead of the root script.
      #
      # Auth is per package: npm uses trusted publishing (OIDC) for a package
      # that has this workflow registered as its trusted publisher, and falls
      # back to the NPM_TOKEN secret for one that does not. Registration is a
      # manual step on npmjs.com (package -> Settings -> Trusted publisher ->
      # repository `zeikar/iki`, workflow `release.yml`); a package publishes
      # with SLSA provenance only after it is registered.
      #
      # Do NOT remove NODE_AUTH_TOKEN until every package is registered — it is
      # what actually authenticates the unregistered ones, so dropping it early
      # breaks their release. Check progress with:
      #   npm view @ikijs/<pkg> dist.attestations
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
