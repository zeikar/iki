name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, create GitHub releases
      pull-requests: write # open/update the release PR
      id-token: write # mint the OIDC token for npm trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The release branch is pushed with a PAT, not GITHUB_TOKEN: events
          # raised by GITHUB_TOKEN never start a workflow run, which left every
          # release PR with a red, job-less CI run. With the PAT the PR gets a
          # real CI pass over the bumped versions. Same token below.
          token: ${{ secrets.CHANGESETS_TOKEN }}

      # No `version:` — action-setup reads the root packageManager pin, so a
      # bump there moves local and CI together.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm 11.5.1+; the runner's Node 22 ships
      # npm 10. Mirrors charivo, whose packages have carried SLSA provenance on
      # every version published since it added this step.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # With changesets pending, this opens/updates a release PR that applies
      # them (versions + CHANGELOGs). Merging that PR lands a main push with no
      # changesets left, and this same step then runs `pnpm release` to publish.
      #
      # `version:` is spelled out because `pnpm version` would hit pnpm's
      # built-in version command instead of the root script.
      #
      # Auth is per package: npm uses trusted publishing (OIDC) for a package
      # that has this workflow registered as its trusted publisher, and falls
      # back to the NPM_TOKEN secret for one that does not. All four packages
      # are registered against `zeikar/iki` + `release.yml`, matching charivo:
      #   npm trust github @ikijs/<pkg> --repo zeikar/iki \
      #     --file release.yml --allow-publish
      #   npm trust list @ikijs/<pkg>          # shows the stored config
      #
      # NODE_AUTH_TOKEN stays until a release has actually published with
      # provenance. Having both is fine — charivo carries the same token and
      # OIDC still wins there. Confirm with
      #   npm view @ikijs/<pkg> dist.attestations
      # and only then drop this env var and the NPM_TOKEN secret.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
          # Passed as the input, not the GITHUB_TOKEN env: the action documents
          # that the env var does not configure it.
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
